name: Preview Deployment

on:
  # Automatic production deployment after successful publish to npm
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]

  # Preview deployment on push to any branch (except main, which uses workflow_run)
  push:
    branches-ignore:
      - main

  # Manual deployment - deploy any branch without publishing to npm
  workflow_dispatch:
    inputs:
      use_npm:
        description: 'Use published npm packages (false = build from source)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  preview:
    # Run if: push to branch, manual trigger, OR publish succeeded
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # For branch pushes and manual deployments: build packages from source
      - name: Build packages from source
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.use_npm != 'true') }}
        run: |
          echo "Building packages from source (branch: ${{ github.ref_name }})"
          pnpm install
          pnpm build:packages

          # Pack packages as tarballs for proper installation (symlinks don't resolve subpath exports correctly)
          echo "Packing packages as tarballs..."
          mkdir -p /tmp/packages
          cd packages/uilint-core && pnpm pack --pack-destination /tmp/packages && cd ../..
          cd packages/uilint && pnpm pack --pack-destination /tmp/packages && cd ../..
          cd packages/uilint-react && pnpm pack --pack-destination /tmp/packages && cd ../..
          cd packages/uilint-eslint && pnpm pack --pack-destination /tmp/packages && cd ../..
          cd packages/jsx-loc-plugin && pnpm pack --pack-destination /tmp/packages && cd ../..
          ls -la /tmp/packages/

      - name: Prepare test-app
        run: |
          # Copy template to /tmp to avoid pnpm workspace hoisting
          cp -R apps/test-app-template /tmp/vercel-deploy
          cd /tmp/vercel-deploy

          # Install dependencies (now isolated from monorepo workspace)
          pnpm install

          # Determine if we should use local packages (push events or manual with use_npm=false)
          USE_LOCAL="false"
          if [ "${{ github.event_name }}" = "push" ]; then
            USE_LOCAL="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_npm }}" != "true" ]; then
            USE_LOCAL="true"
          fi

          if [ "$USE_LOCAL" = "true" ]; then
            echo "Using locally built packages from tarballs..."

            # Install uilint CLI from tarball so we can run init
            pnpm add /tmp/packages/uilint-*.tgz

            # Run uilint init to set up the project (this adds deps to package.json)
            npx uilint init --react --eslint

            # Now install all local packages from tarballs (after init modified package.json)
            # Installing from tarballs ensures subpath exports resolve correctly
            echo "Installing local packages from tarballs..."
            pnpm add /tmp/packages/uilint-core-*.tgz
            pnpm add /tmp/packages/uilint-[0-9]*.tgz
            pnpm add /tmp/packages/uilint-react-*.tgz
            pnpm add /tmp/packages/uilint-eslint-*.tgz
            pnpm add /tmp/packages/jsx-loc-plugin-*.tgz
          else
            # Use published npm version (after automatic publish on main)
            echo "Using published npm packages..."
            npx uilint@latest init --react --eslint
          fi

          # Final install to ensure all dependencies are resolved
          pnpm install

          # Configure static mode for production deployment
          # Update the providers file to use static mode with manifest URL
          if [ -f "app/providers.tsx" ]; then
            sed -i 's/<uilint-devtools \/>/<uilint-devtools mode="static" manifest-url="\/.uilint\/manifest.json" \/>/g' app/providers.tsx
            echo "Configured static mode in app/providers.tsx"
          elif [ -f "src/app/providers.tsx" ]; then
            sed -i 's/<uilint-devtools \/>/<uilint-devtools mode="static" manifest-url="\/.uilint\/manifest.json" \/>/g' src/app/providers.tsx
            echo "Configured static mode in src/app/providers.tsx"
          fi

          # Generate the lint manifest for static mode
          # Note: build-manifest exits with code 1 when lint issues are found, which is expected
          mkdir -p public/.uilint
          npx uilint build-manifest -o public/.uilint/manifest.json --pretty || true
          echo "Generated lint manifest at public/.uilint/manifest.json"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          cd /tmp/vercel-deploy

          # Create .vercel config
          mkdir -p .vercel
          echo '{"orgId":"'$VERCEL_ORG_ID'","projectId":"'$VERCEL_PROJECT_ID'"}' > .vercel/project.json

          # Determine if this is a production deployment (only after successful publish on main)
          IS_PROD="false"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IS_PROD="true"
          fi

          # Build the app
          pnpm build

          # Deploy with or without --prod flag
          if [ "$IS_PROD" = "true" ]; then
            echo "Deploying to PRODUCTION..."
            vercel build --prod --yes --token=$VERCEL_TOKEN
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN 2>&1)
          else
            echo "Deploying PREVIEW for branch: ${{ github.ref_name }}..."
            vercel build --yes --token=$VERCEL_TOKEN
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --yes --token=$VERCEL_TOKEN 2>&1)
          fi
          echo "$DEPLOY_OUTPUT"

          DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "is_production=$IS_PROD" >> $GITHUB_OUTPUT

      - name: Log deployment URL
        run: |
          if [ "${{ steps.deploy.outputs.is_production }}" = "true" ]; then
            echo "🚀 Production deployed!"
          else
            echo "🔍 Preview deployed!"
          fi
          echo "   Branch: ${{ github.ref_name }}"
          echo "   URL: ${{ steps.deploy.outputs.url }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "   Trigger: Push to branch"
            echo "   Packages: Built from source"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "   Trigger: Manual"
            if [ "${{ inputs.use_npm }}" = "true" ]; then
              echo "   Packages: Published npm packages"
            else
              echo "   Packages: Built from source"
            fi
          else
            echo "   Trigger: Automatic (after publish)"
            echo "   Packages: Published npm packages"
          fi
