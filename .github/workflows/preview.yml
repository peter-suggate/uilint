name: Preview Deployment

on:
  # Automatic deployment after successful publish to npm
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]

  # Manual deployment - deploy any branch without publishing to npm
  workflow_dispatch:
    inputs:
      use_npm:
        description: 'Use published npm packages (false = build from source)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  preview:
    # Run if: manual trigger OR publish succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # For manual deployments: build packages from source
      - name: Build packages from source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_npm != 'true' }}
        run: |
          echo "Building packages from source (branch: ${{ github.ref_name }})"
          pnpm install
          pnpm build:packages

      - name: Prepare test-app
        run: |
          # Copy template to /tmp to avoid pnpm workspace hoisting
          cp -R apps/test-app-template /tmp/vercel-deploy
          cd /tmp/vercel-deploy

          # Install dependencies (now isolated from monorepo workspace)
          pnpm install

          # For manual deployment with local packages: link built packages
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_npm }}" != "true" ]; then
            echo "Linking locally built packages..."

            # Install the locally built packages
            pnpm add ${{ github.workspace }}/packages/uilint
            pnpm add ${{ github.workspace }}/packages/uilint-react
            pnpm add ${{ github.workspace }}/packages/uilint-eslint
            pnpm add ${{ github.workspace }}/packages/jsx-loc-plugin

            # Run uilint init with the local version
            npx uilint init --react --eslint
          else
            # Use published npm version (after automatic publish)
            echo "Using published npm packages..."
            npx uilint@latest init --react --eslint
          fi

          # Re-install to ensure uilint-react is installed after init modified package.json
          pnpm install

          # Configure static mode for production deployment
          # Update the providers file to use static mode with manifest URL
          if [ -f "app/providers.tsx" ]; then
            sed -i 's/<uilint-devtools \/>/<uilint-devtools mode="static" manifest-url="\/.uilint\/manifest.json" \/>/g' app/providers.tsx
            echo "Configured static mode in app/providers.tsx"
          elif [ -f "src/app/providers.tsx" ]; then
            sed -i 's/<uilint-devtools \/>/<uilint-devtools mode="static" manifest-url="\/.uilint\/manifest.json" \/>/g' src/app/providers.tsx
            echo "Configured static mode in src/app/providers.tsx"
          fi

          # Generate the lint manifest for static mode
          # Note: build-manifest exits with code 1 when lint issues are found, which is expected
          mkdir -p public/.uilint
          npx uilint build-manifest -o public/.uilint/manifest.json --pretty || true
          echo "Generated lint manifest at public/.uilint/manifest.json"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          cd /tmp/vercel-deploy

          # Create .vercel config
          mkdir -p .vercel
          echo '{"orgId":"'$VERCEL_ORG_ID'","projectId":"'$VERCEL_PROJECT_ID'"}' > .vercel/project.json

          # Build and deploy
          pnpm build
          vercel build --prod --yes --token=$VERCEL_TOKEN
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN 2>&1)
          echo "$DEPLOY_OUTPUT"

          DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Log deployment URL
        run: |
          echo "🚀 Preview deployed!"
          echo "   Branch: ${{ github.ref_name }}"
          echo "   URL: ${{ steps.deploy.outputs.url }}"
          echo "   Trigger: ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Automatic (after publish)' }}"
          echo "   Packages: ${{ github.event_name == 'workflow_dispatch' && inputs.use_npm != 'true' && 'Built from source' || 'Published npm packages' }}"
